plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '6.19.0'
}

group = 'com.umc9th'
version = '0.0.1-SNAPSHOT'
description = 'bizscan'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    //security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    //Jwt
    implementation 'com.auth0:java-jwt:4.2.1'
    // JWT 토큰 생성을 위한 JJWT 라이브러리
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5' // JSON 파싱을 위해 jackson 사용
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:2.8.13'

    //naver search ad api(webclient 의존성)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    //security
    implementation 'org.springframework.boot:spring-boot-starter-security'


    // naver crawling - Selenium
    implementation 'org.seleniumhq.selenium:selenium-java:4.16.1'
    // WebDriver Manager - chrom driver
    implementation 'io.github.bonigarcia:webdrivermanager:5.6.3'


    //lat, lon
    implementation 'org.locationtech.proj4j:proj4j:1.3.0'

}

tasks.named('test') {
    useJUnitPlatform()
}

spotless {
    java {
        // 자바 코드 자동 포맷 (Google Java Style)
        googleJavaFormat()
    }
}