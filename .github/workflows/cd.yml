name: CD

on:
  push:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  # Docker 이미지 빌드 및 푸시
  build:
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.set-profile.outputs.profile }}
      tag: ${{ steps.set-tag.outputs.tag }}

    steps:
      # 소스 코드 체크아웃
      - uses: actions/checkout@v4

      # 브랜치에 따라 실행 프로필 결정
      - name: Set profile
        id: set-profile
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "profile=prod" >> $GITHUB_OUTPUT
          else
            echo "profile=dev" >> $GITHUB_OUTPUT
          fi

      # 브랜치별 Docker 이미지 태그 결정
      - name: Set image tag
        id: set-tag
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "tag=prod" >> $GITHUB_OUTPUT
          else
            echo "tag=dev" >> $GITHUB_OUTPUT
          fi

      # buildx 세팅
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Docker Hub 로그인
      - name: Docker login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # Docker 이미지 빌드 및 push
      - name: Build and push Docker image
        run: |
          IMAGE=${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}
          TAG=${{ steps.set-tag.outputs.tag }}

          docker buildx build \
            -f docker/Dockerfile \
            -t ${IMAGE}:${TAG} \
            --push .

  # self-hosted 서버에서 배포
  deploy:
    runs-on: self-hosted
    needs: build

    steps:
      # 레포지토리 체크아웃 (docker-compose 사용)
      - uses: actions/checkout@v4

      # docker-compose로 서비스 재배포
      - name: Deploy with Docker Compose
        env:
          PROFILE: ${{ needs.build.outputs.profile }}
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_REPO: ${{ secrets.DOCKER_REPO }}
        run: |
          set -e

          cd docker

          echo "$ENV_FILE" > .env
          echo "PROFILE=${PROFILE}" >> .env
          echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
          echo "DOCKER_USERNAME=${DOCKER_USERNAME}" >> .env
          echo "DOCKER_REPO=${DOCKER_REPO}" >> .env

          docker compose --env-file .env down
          docker compose --env-file .env pull
          docker compose --env-file .env up -d --build