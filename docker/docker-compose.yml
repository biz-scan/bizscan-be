services:
  app:
    image: ${DOCKER_USERNAME}/${DOCKER_REPO}:${IMAGE_TAG}
    container_name: bizscan-app-${PROFILE:-dev}
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${PROFILE:-dev}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS}
      TZ: Asia/Seoul
      NAVER_AD_API_KEY: ${NAVER_AD_API_KEY}
      NAVER_AD_SECRET_KEY: ${NAVER_AD_SECRET_KEY}
      NAVER_AD_CUSTOMER_ID: ${NAVER_AD_CUSTOMER_ID}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bizscan-network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    expose:
      - "3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - bizscan-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD | grep 'mysqld is alive'" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  dozzle:
    image: amir20/dozzle:latest
    ports:
      - "9999:8080"
    environment:
      - TZ=Asia/Seoul
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - bizscan-network
    restart: unless-stopped

networks:
  bizscan-network:
    driver: bridge

volumes:
  mysql-data: